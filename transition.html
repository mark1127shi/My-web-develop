<!doctype html>
<html>
<head>
	<style>
		#demo{
			width:300px;
			height:300px;
			background-color:lightblue;
			transition:width 1s ,height 1s,transform 1s;
		}

		#demo:hover{
			width:600px;
			height:600px;
			transform: rotate(360deg);
		}

	</style>
</head>
<body>
	<div id='demo'></div>
</body>
</html>
