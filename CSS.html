<!DOCTYPE html>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Rouge+Script&display=swap" rel="stylesheet">
	<style>
		*{
			font-family:Rouge Script;
		}
		h1{
			color:red;
			font-size:60px;
			text-shadow: 3px 3px 5px blue;
		}
		#welcome{
			color:green;
			font-size:50px;
			text-shadow: 3px 3px 5px orange;
		}
		.one{
			color:red;
			text-decoration:underline;
			front-size:40px;
		}

	</style>
	<!-- 
		1.element selector  just call the name of the it.
		2.ID selector   '#' for select
		3.class selector '.'for select
		4.universal selector '*'
	-->
</head>	
<body>
	<h1 class='one'>Hello World</h1>
	<h1 id='welcome'><i>Welcome</i></h1>
	<p class='one'>Paragraph 1</p>
	<p>Paragraph 2</p>
</body>
</html>
