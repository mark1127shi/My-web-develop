<!DOCTYPE html>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Rouge+Script&family=Story+Script&display=swap" rel="stylesheet">
	
	<style>
		h1{
			color: #003399;
			font-size:3em;
			font-family: Story Script;
			text-shadow: 5px 5px 5px #99ccff ;		
		}
		p{
			font-size:2em;

		.japan{
			width:80%;
			border-radius: 10px;
			transition:width 1s ;

		.japan:hover{
			width:100%;

		.container{
    		width: 80%;
    		background: white;
    		margin: auto;
    		padding: 40px;

    	}
    	.photo{
			width:600px;
			display: block;
			background: white;
			margin-left: auto;
			border-radius: 3px;
			box-shadow: 0 0 0px rgba(0,0,0,0.2);

		}

    	#p1{
    		position: relative;
  			left: 5px;
  			border: 1px dashed red;
  			border-radius:10px ;
    	}
			

    	#p2{
    		position:relative;
    		left:200px ;
    		margin-top:-70px;
    		border: 1px dashed purple;
    		border-radius:10px;
    	}
    	#p3{
    		position: relative;
    		left:5px;
    		margin-top:-60px ;
    		border: 1px dashed lightblue;
    		border-radius: 10px;
    	}
    	#p4{
    		position:relative;
    		left:200px ;
    		margin-top:-70px;
    		border: 1px dashed pink;
    		border-radius:10px;
    	}

    	/*
    	img:hover{
			width:100%;
		}
		*/

		.Estimated{
			margin-left:auto;
			box-shadow: 0 0 0px rgba(0, 0, 0, 0.2);
		}

<body><div class='container'>
	<h1><center>Japan Travel Plan</center></h1>

	<div class='Estimated'>

		<h2>Estimated participants: 3 </h2>
	</div>

	<center><img id='japan' src='https://www.lot.com/content/dam/lot/lot-com/destination-photos/japonia/Tokyo-5%20.coreimg.82.2560.jpg/1723628368208/Tokyo-5%20.jpg' title='This is Japan.' alt='Japan Photo' width='80%'></center>
	<p>First, let's enjoy the beautiful pictures of Japan.</p>
	<div class="photo">
		<img id='p1' src="https://vj-prod-website-cms.s3.ap-southeast-1.amazonaws.com/shutterstock304093253supersize-1675509746654.jpg" title="Mount Fuji is one of Japan's top tourist symbols." width="400px">
		<img id='p2' src='https://vj-prod-website-cms.s3.ap-southeast-1.amazonaws.com/shutterstock129611225huge-1675509770695.jpg' title='Tokyo Tower is an observation deck and panoramic view of the beautiful Tokyo city from above.' width='400px'>
		<img id='p3' src='https://vj-prod-website-cms.s3.ap-southeast-1.amazonaws.com/shutterstock762780751huge-1675509796271.jpg' title='The Kyoto Monuments cluster stands out with Kinkakuji Temple covered with brilliant pure gold leaves.' width='400px'>
		<img id='p4' src="https://i.ytimg.com/vi/QXnDG6K4m40/maxresdefault.jpg" title='Dears in Nara under the sakura trees' width='400px'>
